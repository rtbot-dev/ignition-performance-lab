name: Validate benchmarks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/validate.py
      - run: python scripts/test_launchers.py
      - run: sh -n lab.sh scripts/start.sh 'Start Lab.command'
      - name: Validate Compose without starting a gateway
        env:
          ACCEPT_IGNITION_EULA: 'Y'
          BENCH_PASSWORD: 'configuration-validation-only'
        run: |
          for config in benchmarks/*/compose.yaml; do
            docker compose -f "$config" config --quiet
          done
      - run: python scripts/package.py
